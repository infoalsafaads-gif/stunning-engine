<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>AL SAFA | Advertising & Media</title>
<style>
:root{--gold:#d9ad48;--gold2:#f8df91;--ink:#050505;--white:#f5f3ee;--muted:#a7a19a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 18%,#171512 0,#090909 44%,#030303 100%);color:var(--white);font-family:Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:28px 16px;overflow-x:hidden}
.wrap{width:min(100%,440px);position:relative}
.brand{text-align:center;margin:0 auto 4px}
.logo{width:min(100%,390px);height:auto;display:block;margin:auto;filter:drop-shadow(0 8px 24px #000)}
.card{position:relative;background:linear-gradient(155deg,#0b0b0b,#050505);border:1px solid #b88b3929;border-radius:26px;padding:25px 22px 22px;box-shadow:0 24px 70px #000d,inset 0 1px #ffffff08;overflow:hidden}
.card:before{content:"";position:absolute;top:0;right:18%;left:18%;height:1px;background:linear-gradient(90deg,transparent,#c9a04b99,transparent)}
.tagline{text-align:center;color:#b9aa8b;font-size:13px;letter-spacing:.25px;margin:0 0 23px}
.links{display:grid;gap:11px}
.link{min-height:60px;text-decoration:none;color:#f4f1e9;background:linear-gradient(110deg,#090909,#111);border:1px solid #ffffff14;border-radius:13px;display:flex;align-items:center;padding:0 15px;gap:14px;transition:all .22s;box-shadow:0 7px 18px #0009,inset 0 1px #ffffff08}
.link:hover{transform:translateY(-2px);border-color:#c39b4a88;background:linear-gradient(110deg,#101010,#17130c);box-shadow:0 10px 24px #000,0 0 16px #c69b3a12}
.icon{width:37px;height:37px;display:grid;place-items:center;flex:none;border-radius:10px;background:linear-gradient(145deg,#171717,#030303);border:1px solid #b88d3c55;box-shadow:inset 0 1px #ffffff12,0 3px 8px #000}
.icon svg{width:23px;height:23px;fill:none;stroke:url(#goldStroke);stroke:#e8c56e;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px #d8a83d66)}
.label{font-size:15px;font-weight:600;flex:1}
.arrow{color:#a88a4e;font-size:19px;direction:ltr}
.link.primary{border-color:#b88d3c55;background:linear-gradient(110deg,#0b0b0b,#15120c)}
.link.primary .label{color:#e8ce8e}
.divider{height:1px;background:linear-gradient(90deg,transparent,#b88d3c44,transparent);margin:22px 0 16px}
.foot{text-align:center;color:#77716a;font-size:10px;letter-spacing:1.8px;direction:ltr}
.foot span{color:#d8b35e}
@media(min-width:700px){.wrap{width:430px}.card{padding:28px 26px 24px}}
@media(max-width:360px){body{padding:18px 11px}.card{padding:22px 16px 19px}.link{min-height:55px}.label{font-size:14px}}
